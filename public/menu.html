<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เมนูและสต็อก - Whatever Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/whatever-cafe.css">
</head>
<body>

  <header id="wnHeader"></header>

  <main class="wn-container">

    <div class="wn-page-header">
      <div class="wn-page-title-group">
        <h1>เมนูและสต็อก</h1>
        <p>ราคาและจำนวนแก้วที่เหลือของสาขาที่เลือกด้านบน เมนูที่เหลือต่ำกว่า 10 แก้วจะถูกนับเป็นใกล้หมด</p>
      </div>

      <button type="button" id="btnOpenAddMenu" class="wn-btn wn-btn-primary">เพิ่มเมนู</button>
    </div>

    <div class="wn-kpi-grid">
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>เมนูทั้งหมด</small>
          <h2 id="kpiTotalMenus">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>ขายได้</small>
          <h2 id="kpiInStock">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card yellow">
        <div class="wn-kpi-details">
          <small>ใกล้หมด</small>
          <h2 id="kpiLowStock">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card alert">
        <div class="wn-kpi-details">
          <small>หมดแล้ว</small>
          <h2 id="kpiOutOfStock">0</h2>
        </div>
      </div>
    </div>

    <div class="wn-card">
      <div class="wn-card-header">
        <div class="wn-filters">
          <input type="search" id="menuSearch" class="wn-input" placeholder="ค้นหาชื่อเมนู" aria-label="ค้นหาชื่อเมนู">

          <select id="catFilter" class="wn-select" aria-label="หมวดหมู่">
            <option value="all">ทุกหมวด</option>
            <option value="1">ชา</option>
            <option value="2">กาแฟ</option>
            <option value="3">นม/โกโก้</option>
            <option value="4">อื่น ๆ</option>
          </select>

          <select id="stockFilter" class="wn-select" aria-label="สต็อก">
            <option value="all">สต็อกทั้งหมด</option>
            <option value="low">ใกล้หมด</option>
            <option value="out">หมดแล้ว</option>
          </select>
        </div>

        <div class="wn-count"><strong id="itemCountText">0</strong> รายการ</div>
      </div>

      <div class="wn-table-scroll">
        <table class="wn-table">
          <thead>
            <tr>
              <th>รหัส</th>
              <th>เมนู</th>
              <th>หมวด</th>
              <th class="text-right">ราคา</th>
              <th class="text-right">เหลือ (แก้ว)</th>
              <th>สถานะ</th>
              <th class="text-right"><span class="wn-muted">จัดการ</span></th>
            </tr>
          </thead>
          <tbody id="menuTableBody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <div class="wn-modal-backdrop hidden" id="menuFormModal">
    <div class="wn-modal sm" role="dialog" aria-modal="true" aria-labelledby="menuModalTitle">
      <div class="wn-modal-header">
        <h3 class="wn-modal-title" id="menuModalTitle">เพิ่มเมนู</h3>
        <button type="button" class="wn-modal-close" id="btnCloseMenuModal" aria-label="ปิด">&times;</button>
      </div>

      <form id="menuForm" novalidate>
        <div class="wn-modal-body">
          <input type="hidden" id="formMenuId">

          <div class="wn-form-group">
            <label class="wn-form-label" for="formName">ชื่อเมนู</label>
            <input type="text" id="formName" class="wn-input" placeholder="เช่น มัทฉะลาเต้เย็น" required>
          </div>

          <div class="wn-form-group">
            <label class="wn-form-label" for="formCategory">หมวด</label>
            <select id="formCategory" class="wn-select" required>
              <option value="1">ชา</option>
              <option value="2">กาแฟ</option>
              <option value="3">นม/โกโก้</option>
              <option value="4">อื่น ๆ</option>
            </select>
          </div>

          <div class="wn-form-row">
            <div class="wn-form-group">
              <label class="wn-form-label" for="formPrice">ราคา (บาท)</label>
              <input type="number" id="formPrice" class="wn-input" min="1" step="0.5" placeholder="55" required>
            </div>
            <div class="wn-form-group">
              <label class="wn-form-label" for="formStock">สต็อก (แก้ว)</label>
              <input type="number" id="formStock" class="wn-input" min="0" step="1" placeholder="20" required>
            </div>
          </div>
        </div>

        <div class="wn-modal-footer">
          <button type="button" class="wn-btn wn-btn-secondary" id="btnCancelMenuModal">ยกเลิก</button>
          <button type="submit" class="wn-btn wn-btn-primary" id="btnSaveMenu">บันทึกเมนู</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
