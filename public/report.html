<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยอดขาย - Whatever Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/whatever-cafe.css">
  <style>
    @media print {
      .wn-navbar, .wn-report-filters, .wn-btn-logout, #btnPrintReport {
        display: none !important;
      }
      body {
        background: #ffffff !important;
      }
      .wn-container {
        padding: 0 !important;
      }
    }
  </style>
</head>
<body>

  <header id="wnHeader"></header>

  <main class="wn-container">

    <div class="wn-page-header">
      <div class="wn-page-title-group">
        <h1>ยอดขาย</h1>
        <p>ยอดขายแยกตามสาขาและเมนู ในช่วงวันที่ที่เลือก</p>
      </div>

      <button type="button" id="btnPrintReport" class="wn-btn wn-btn-secondary">พิมพ์รายงาน</button>
    </div>

    <div class="wn-card wn-report-filters">
      <form id="reportFilterForm">
        <div class="wn-field">
          <span class="wn-form-label">ช่วงเวลา</span>
          <div class="wn-segment">
            <button type="button" class="wn-btn wn-btn-secondary date-preset" data-preset="today">วันนี้</button>
            <button type="button" class="wn-btn wn-btn-secondary date-preset active" data-preset="week">7 วัน</button>
            <button type="button" class="wn-btn wn-btn-secondary date-preset" data-preset="month">เดือนนี้</button>
          </div>
        </div>

        <div class="wn-field">
          <label class="wn-form-label" for="reportFrom">ตั้งแต่</label>
          <input type="date" id="reportFrom" class="wn-input">
        </div>

        <div class="wn-field">
          <label class="wn-form-label" for="reportTo">ถึง</label>
          <input type="date" id="reportTo" class="wn-input">
        </div>

        <div class="wn-field">
          <label class="wn-form-label" for="reportBranch">สาขา</label>
          <select id="reportBranch" class="wn-select">
            <option value="all">ทุกสาขา</option>
            <option value="1">สยาม</option>
            <option value="2">สีลม</option>
          </select>
        </div>

        <div class="wn-field">
          <label class="wn-form-label" for="reportTopFilter">นับเมนูขายดีจาก</label>
          <select id="reportTopFilter" class="wn-select">
            <option value="all">ทั้งช่วงที่เลือก</option>
            <option value="week">7 วันล่าสุด</option>
            <option value="day">วันล่าสุด</option>
          </select>
        </div>
      </form>
    </div>

    <div class="wn-kpi-grid">
      <div class="wn-kpi-card lead">
        <div class="wn-kpi-details">
          <small>ยอดขายสุทธิ</small>
          <h2 id="kpiTotalSales">฿0.00</h2>
        </div>
      </div>
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>จำนวนบิล</small>
          <h2 id="kpiOrderCount">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>เฉลี่ยต่อบิล</small>
          <h2 id="kpiAvgTicket">฿0.00</h2>
        </div>
      </div>
    </div>

    <div class="wn-report-columns">
      <div class="wn-card">
        <div class="wn-card-header">
          <h2>แยกตามสาขา</h2>
        </div>
        <div class="wn-table-scroll">
          <table class="wn-table">
            <thead>
              <tr>
                <th>สาขา</th>
                <th class="text-center">บิล</th>
                <th class="text-right">ยอดขาย</th>
                <th class="text-right">สัดส่วน</th>
              </tr>
            </thead>
            <tbody id="branchTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="wn-card">
        <div class="wn-card-header">
          <h2>เมนูขายดี 10 อันดับ</h2>
        </div>
        <div class="wn-table-scroll">
          <table class="wn-table">
            <thead>
              <tr>
                <th>อันดับ</th>
                <th>เมนู</th>
                <th class="text-right">แก้ว</th>
                <th class="text-right">ยอดขาย</th>
              </tr>
            </thead>
            <tbody id="topMenusTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/report.js"></script>
</body>
</html>
