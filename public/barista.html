<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บาร์ - Whatever Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400..700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/whatever-cafe.css">
</head>
<body>

  <header id="wnHeader"></header>

  <main class="wn-container">

    <div class="wn-page-header">
      <div class="wn-page-title-group">
        <h1>ใบสั่งที่บาร์</h1>
        <p>กดปุ่มใต้ใบสั่งเมื่อเริ่มชงและเมื่อชงเสร็จ ใบที่รอเกิน 5 นาทีเวลาจะเป็นสีแดง</p>
      </div>

      <div class="wn-page-actions">
        <span id="liveSyncBadge" class="wn-live">อัปเดตอัตโนมัติ</span>
        <button type="button" id="btnSoundToggle" class="wn-btn wn-btn-secondary wn-btn-sm">
          เสียงเตือน <strong id="soundStateText">เปิด</strong>
        </button>
        <button type="button" id="btnManualRefresh" class="wn-btn wn-btn-secondary wn-btn-sm">รีเฟรช</button>
      </div>
    </div>

    <div class="wn-kpi-grid">
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>รอชง</small>
          <h2 id="kpiPendingCount">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>กำลังชง</small>
          <h2 id="kpiPreparingCount">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>รอลูกค้ารับ</small>
          <h2 id="kpiReadyCount">0</h2>
        </div>
      </div>
      <div class="wn-kpi-card">
        <div class="wn-kpi-details">
          <small>ส่งแล้ว</small>
          <h2 id="kpiCompletedCount">0</h2>
        </div>
      </div>
    </div>

    <div class="wn-kds-toolbar">
      <div class="wn-kds-filter-pills" id="kdsFilterPills" role="group" aria-label="กรองใบสั่ง">
        <button type="button" class="wn-kds-pill active" data-filter="active">
          ต้องทำ <span class="badge" id="badgeActiveCount">0</span>
        </button>
        <button type="button" class="wn-kds-pill" data-filter="pending">
          รอชง <span class="badge" id="badgePending">0</span>
        </button>
        <button type="button" class="wn-kds-pill" data-filter="preparing">
          กำลังชง <span class="badge" id="badgePreparing">0</span>
        </button>
        <button type="button" class="wn-kds-pill" data-filter="ready">
          พร้อมเสิร์ฟ <span class="badge" id="badgeReady">0</span>
        </button>
        <button type="button" class="wn-kds-pill" data-filter="completed">
          ส่งแล้ว <span class="badge" id="badgeCompleted">0</span>
        </button>
        <button type="button" class="wn-kds-pill" data-filter="all">
          ทั้งหมด <span class="badge" id="badgeAll">0</span>
        </button>
      </div>

      <div class="wn-count">
        <strong id="kdsFilteredText">0</strong> ใบ
      </div>
    </div>

    <div class="wn-kds-grid" id="kdsOrderGrid"></div>

  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/barista.js"></script>
</body>
</html>
